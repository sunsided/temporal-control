[package]
name = "temporal-control-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
temporal-control = { path = ".." }

# Standalone: not a member of any workspace.
[workspace]

# Mirrors the root lint table; `workspace = true` cannot reach a separate workspace.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dispatch"
path = "fuzz_targets/dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stn"
path = "fuzz_targets/stn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dc_checkers"
path = "fuzz_targets/dc_checkers.rs"
test = false
doc = false
bench = false
